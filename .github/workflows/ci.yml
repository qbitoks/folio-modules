name: Engines CI and releases

on:
  push:
    branches: [main]
    tags: ['piper-v*', 'silero-v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: engines-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Tests and debug build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Validate manifests
        run: python3 -c "import json; json.load(open('modules.json')); json.load(open('catalogs.json'))"
      - name: Build and test
        run: bash ./gradlew :tts-common:testDebugUnitTest :tts-silero:testDebugUnitTest :tts-piper:assembleDebug :tts-silero:assembleDebug :pdf-mj:app:assembleDebug --console=plain

  release:
    name: Release an engine
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install pinned Android SDK components
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0"'
      - name: Check out the tagged commit
        run: git checkout --detach "$GITHUB_REF_NAME"
      - name: Read the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release published by hand (local build signed with the same key) is final.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          module="${GITHUB_REF_NAME%%-v*}"
          version="${GITHUB_REF_NAME#*-v}"
          grep -q "versionName = \"$version\"" "tts-$module/build.gradle.kts" || { echo "versionName in tts-$module differs from $version"; exit 1; }
          echo "module=$module" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Folio's signing key
        if: steps.tag.outputs.skip != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'ANDROID_DEBUG_KEYSTORE_BASE64 is required'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/folio.keystore"
          echo "ANDROID_DEBUG_KEYSTORE_PATH=$RUNNER_TEMP/folio.keystore" >> "$GITHUB_ENV"
      - name: Build and test
        if: steps.tag.outputs.skip != 'true'
        run: bash ./gradlew :tts-common:testDebugUnitTest :tts-silero:testDebugUnitTest :tts-${{ steps.tag.outputs.module }}:assembleRelease --console=plain
      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/folio.keystore"
      - name: Check the certificate and publish
        if: steps.tag.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODULE: ${{ steps.tag.outputs.module }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          apk="folio-$MODULE-$VERSION.apk"
          cp "tts-$MODULE/build/outputs/apk/release/tts-$MODULE-release.apk" "$apk"
          cert=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/.*SHA-256 digest: //p' | head -1)
          test "$cert" = "b3e3703d07d76a6474ef19620632a092763d101db5750ab2c00f311582e8358f" || { echo "Unexpected certificate $cert"; exit 1; }
          sha256sum "$apk" > SHA256SUMS.txt
          title="Folio ${MODULE^} $VERSION"
          gh release create "$GITHUB_REF_NAME" "$apk" SHA256SUMS.txt --title "$title" --notes "Движок озвучки для Folio. Устанавливается из Folio: «Голос» → «Модули озвучки»."
          git checkout main
          python3 scripts/update_index.py "$MODULE" "$apk" "https://github.com/${GITHUB_REPOSITORY}/releases/download/$GITHUB_REF_NAME/$apk"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules.json
          git commit -m "chore: publish $MODULE $VERSION in modules.json"
          git push origin main
